name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      events-db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relayforge_events
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: relayforge-ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U relayforge -d relayforge_events"
          --health-interval 5s --health-timeout 3s --health-retries 15
      deliveries-db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relayforge_deliveries
          POSTGRES_USER: relayforge
          POSTGRES_PASSWORD: relayforge-ci
        ports: [5433:5432]
        options: >-
          --health-cmd "pg_isready -U relayforge -d relayforge_deliveries"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify all Java microservices
        run: mvn -B verify
      - name: Run live microservice smoke test
        run: node scripts/smoke-test.mjs
      - name: Verify PostgreSQL service integration
        run: node scripts/smoke-test.mjs
        env:
          SMOKE_EVENTS_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/relayforge_events
          SMOKE_DELIVERIES_DATABASE_URL: jdbc:postgresql://127.0.0.1:5433/relayforge_deliveries
          SMOKE_DATABASE_USER: relayforge
          SMOKE_DATABASE_PASSWORD: relayforge-ci
      - name: Install dashboard
        run: npm ci
        working-directory: frontend
      - name: Test dashboard
        run: npm test
        working-directory: frontend
      - name: Check frontend formatting
        run: npm run format:check
        working-directory: frontend
      - name: Build dashboard
        run: npm run build
        working-directory: frontend
