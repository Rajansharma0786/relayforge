[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relayforge"
version = "0.1.0"
description = "Foundations for durable, observable webhook delivery"
requires-python = ">=3.11"
authors = [{name = "Rajan Sharma"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
relayforge = "relayforge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
