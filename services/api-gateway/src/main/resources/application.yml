spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 5s
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
relayforge:
  events-url: ${EVENT_SERVICE_URL:http://127.0.0.1:8081}
  delivery-url: ${DELIVERY_SERVICE_URL:http://127.0.0.1:8082}
