spring:
  application:
    name: delivery-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
relayforge:
  internal-token: ${INTERNAL_SERVICE_TOKEN:}
